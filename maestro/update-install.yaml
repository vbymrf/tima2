# Установка предложенного обновления — вторая половина сценария О1.
#
# Отдельным файлом, потому что зовётся ПО УСЛОВИЮ: сервер отвечает одним из двух —
# «Обновить» или «Установлена последняя версия». Прежде эта половина шла безусловно, и
# телефон, уже стоявший на свежей версии, падал на шаге «Установить» (Samsung,
# 2026-09-16). Падение выглядело как поломка обновления, а на деле обновлять было нечего.
#
# Условие живёт в `update.yaml`; здесь — только то, что делается, когда обновление есть.
appId: io.tima.app.v2
---
# ── Наше предупреждение перед установкой ─────────────────────────────────────
# «Обновить» есть, когда пакет ещё не скачан; «Установить» — когда скачан прошлым
# заходом. Нажимаем то, что есть.
- runFlow:
    when:
      visible: "Обновить"
    commands:
      - tapOn: "Обновить"
      - extendedWaitUntil:
          visible: "Установить"
          timeout: 120000
      - takeScreenshot: "О1-предупреждение"

- tapOn: "Установить"

# ── Разрешение «Установка неизвестных приложений» ────────────────────────────
#
# Третье вендорское расхождение, и его не было ни на realme, ни на Redmi: там
# разрешение уже выдано с прошлых установок. На Samsung, куда приложение поставлено
# начисто, система вместо окна установщика уводит в НАСТРОЙКИ — «Разрешение для
# этого источника», переключатель `android:id/switch_widget`.
#
# Сам переключатель `clickable=false`; кликабельна строка вокруг него. Поэтому
# нажимаем надпись: её узел лежит внутри этой строки.
#
# Ветка, а не прямой шаг: на телефоне, где разрешение уже есть, экрана не будет.
- runFlow:
    when:
      visible: "Установка неизвестных приложений"
    commands:
      - takeScreenshot: "О1-разрешение-источника"
      - tapOn: "Разрешение для этого источника"
      # НЕ `back`: проверено на Samsung — он уходит не в приложение, а вглубь чужого
      # стека настроек (оказались в настройках Wi-Fi). Возвращаемся запуском.
      - launchApp
      - extendedWaitUntil:
          visible: "Установить"
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible: "Установить"
          commands:
            - tapOn: "Установить"

# ── Системное окно установщика ───────────────────────────────────────────────
#
# ЗДЕСЬ НЕЛЬЗЯ ПО ТЕКСТУ, И ЭТО ПРОВЕРЕНО НА ДВУХ ТЕЛЕФОНАХ:
#
#   Redmi (Android 14)  «Обновить приложение?»                 Отмена | Обновить
#   realme (Android 11) «Установить обновление для этого        ОТМЕНА | УСТАНОВИТЬ
#                        приложения? Вы не потеряете данные»
#
# Окно рисует не наше приложение, а системный установщик, и вендор переписывает в нём
# и вопрос, и надписи на кнопках. Сценарий, привязанный к тексту, работает на том
# телефоне, где его писали, и падает на соседнем — именно это и произошло.
#
# `android:id/button1` — положительная кнопка любого системного диалога Android.
# Идентификатор общий по платформе, вендор его не трогает.
#
# Три минуты, а не одна: между «Установить» и окном системы идёт скачивание 15 МБ по
# сети телефона. На Samsung за минуту скачалось 62 % — и прогон упал не на Play
# Защите, а на этом ожидании (2026-09-15, 13:19).
- extendedWaitUntil:
    visible:
      id: "android:id/button1"
    timeout: 180000
    optional: true

# ── Связь оборвалась — одна повторная попытка ────────────────────────────────
#
# Приложение ловит обрыв само: «Обновление не скачалось. Связь оборвалась» и кнопка
# «Попробовать ещё раз». Так было на Samsung 2026-09-15, 13:45 — Wi-Fi у него слабый,
# за минуту до того он тянул 15 МБ дольше минуты. Человек в этом месте нажал бы «ещё
# раз», и сценарий делает то же — но ровно ОДИН раз: вторая подряд неудача — уже не
# случайность, а поломка сети или сервера, и её надо показать, а не замазать повторами.
- runFlow:
    when:
      visible: "Обновление не скачалось"
    commands:
      - takeScreenshot: "О1-обрыв-связи"
      - tapOn: "Попробовать ещё раз"
      - extendedWaitUntil:
          visible:
            id: "android:id/button1"
          timeout: 180000

- assertVisible:
    id: "android:id/button1"
- takeScreenshot: "О1-окно-системы"
- tapOn:
    id: "android:id/button1"

# ── Play Защита — на стендовых телефонах ВЫКЛЮЧЕНА ───────────────────────────
#
# Окно `com.android.vending/…PlayProtectDialogsActivity`: «Рекомендуется проверка
# приложения». Появлялось на всех трёх телефонах, и сценарий на нём вставал.
#
# ── РЕШЕНИЕ ЗАКАЗЧИКА 2026-09-15: вариант 1 ─────────────────────────────────
#
#   adb shell settings put global package_verifier_user_consent -1
#
# Поставлено на Samsung, realme и Redmi (было 1). После этого окно не появляется
# вовсе — проверено полным прогоном на Samsung 13:52: ветка ниже пропущена, установка
# прошла, код возврата 0. Вернуть как было: то же с `1`.
#
# Это правка стендовых устройств, а не решение для людей: у них Play Защита остаётся,
# и окно они увидят. Решение про них (отправлять ли сборку в Google) не принято.
#
# ── ПОЧЕМУ НЕ НАЖИМАТЬ «УСТАНОВИТЬ БЕЗ ПРОВЕРКИ» СЦЕНАРИЕМ ─────────────────
#
# Потому что нельзя, и это проверено на трёх телефонах. «Подробнее» — отдельный узел,
# Maestro его нажимает. «Установить без проверки» — последняя СТРОКА внутри чужого
# текстового узла, а не узел:
#
#   узел [120,1249][960,1549]  clickable=false
#   текст: «Проверка может занять некоторое время. Ее результаты появятся на
#           экране. Подробнее о Play Защите…» — пустая строка — «Установить без
#           проверки»
#
# Maestro нажимает узлы, а не слова внутри узла. Регулярка `.*Установить без
# проверки.*` находит узел и нажимает его ЦЕНТР — строку «Подробнее о Play Защите…».
# Проверено прогоном 10:44 на Samsung: шаг прошёл COMPLETED, а на снимке следом —
# Chrome со справкой support.google.com. Зелёный шаг и есть промах. По проценту экрана
# тоже нельзя: Samsung и realme 65 %, Redmi 68 %.
#
# Ветка оставлена: если окно всё же появится (телефон без настройки, сброс, обновление
# Play Маркета) — сценарий остановится ЯВНО, с причиной в журнале.
- runFlow:
    when:
      visible: "Рекомендуется проверка приложения"
    commands:
      - takeScreenshot: "О1-play-защита"
      - assertVisible: "ОСТАНОВКА: Play Защита включена на этом телефоне — см. комментарий в сценарии"

# ── Доказательство: новая версия стоит и работает ────────────────────────────
#
# Приложение на время установки закрывается — система подменяет пакет. Запускаем
# заново, и первое, что оно показывает после обновления, — свой экран «Обновление
# установлено» с номером работающей версии и списком изменений. Это и есть
# доказательство: его рисует уже НОВАЯ сборка, старая этого экрана не знает.
#
# Первая редакция шла в настройки за «Установлена последняя версия» и падала: экран
# «Обновление установлено» стоит поверх всего, и шестерёнки за ним не видно. Снято на
# Samsung 2026-09-15, 13:24 — первом прогоне, дошедшем сюда без человека.
- launchApp
- extendedWaitUntil:
    visible: "Обновление установлено"
    timeout: 60000
- assertVisible: ".*Работает версия.*"
- takeScreenshot: "О1-итог"
- tapOn: "Понятно"
