# Окно звонка — сценарий З1.
#
# Проверяет путь к окну 0 и обратно: телефонная кнопка стоит в шапке личной переписки,
# нажатие открывает окно звонка, окно живёт, пока идёт звонок, и исчезает, когда звонок
# кончился. Это и есть весь договор окна 0 — оно **временное**, и список окон у человека
# от звонка к звонку разный.
#
# ── ЧЕГО ЭТОТ СЦЕНАРИЙ НЕ ПРОВЕРЯЕТ И НЕ БУДЕТ ──────────────────────────────
#
# **Разговора.** Для него нужны двое, а здесь один телефон: дальше «Звоним…» дело не
# пойдёт, потому что отвечать некому. Второй конец — либо второй телефон, либо
# `livekit-cli` (ПЛАН-СТЕНДА-ЗВОНКОВ §4а). Это граница сценария, а не его изъян.
#
# **Звука и картинки.** Maestro видит дерево доступности, а не поток. Что в комнате
# действительно идёт медиа, показывают только человек и числа стенда.
#
# ── ПЕРВЫЙ ПРОГОН ОТЛИЧАЕТСЯ ОТ ОСТАЛЬНЫХ ───────────────────────────────────
#
# На первом звонке система спрашивает про микрофон. Диалог вендор переписывает как хочет
# («Разрешить», «Только при использовании приложения», «ВО ВРЕМЯ ИСПОЛЬЗОВАНИЯ»), поэтому
# шаг здесь необязательный и с широким отбором: на втором прогоне диалога уже не будет.
#
# ── КОГО ЗОВЁМ ──────────────────────────────────────────────────────────────
#
# Имя собеседника — снаружи, потому что оно у каждого стенда своё:
#
#   maestro test -e PEER=samsung2 maestro/call-window.yaml
#
# Через `run.sh` подставляется значение по умолчанию ниже. Имени нет в списке — сценарий
# упадёт на поиске переписки, и в падении будет видно имя: это честнее, чем взять первую
# попавшуюся строку и молча проверить не то.
appId: io.tima.app.v2
env:
  PEER: samsung2
---
- launchApp

# Окно «Телефон», вкладка «Чаты» — то, чем приложение встречает. Отбор по метке, а не по
# надписи: надписей у нас три языка (см. `ShellNames.kt`).
- assertVisible:
    id: "tab:Chats"

# ── ОКНА 0 НЕТ, ПОКА НЕТ ЗВОНКА ─────────────────────────────────────────────
#
# Это главное свойство временного окна, и проверить его можно только ДО звонка. Нажатие
# на плашку с названием окна открывает переключатель — другого входа в него на телефоне
# нет (`WindowHeader.onSwitchWindows`).
- tapOn: "Телефон"
- assertNotVisible: "Звонок"
- takeScreenshot: З1-окна-0-нет
- tapOn: "✕"

# ── Переписка и телефонная кнопка ───────────────────────────────────────────
- scrollUntilVisible:
    element: "${PEER}"
    direction: DOWN
    timeout: 20000
- tapOn: "${PEER}"

# Метка, а не глиф: тот же значок носит окно «Телефон» в рейке, и отбор по видимому
# тексту нашёл бы два узла. Кнопки нет вовсе — переписка групповая или платформа не умеет
# звонить; оба случая законны, поэтому проверка явная и с понятным падением.
- assertVisible:
    id: "chat:call"
- takeScreenshot: З1-кнопка-в-шапке
- tapOn:
    id: "chat:call"

# Разрешение на микрофон — только на первом звонке за установку.
- tapOn:
    text: ".*(Разреш|РАЗРЕШ|разреш|При использовании|Во время использования|ВО ВРЕМЯ ИСПОЛЬЗОВАНИЯ).*"
    optional: true

# ── Окно 0 открылось ────────────────────────────────────────────────────────
#
# Исходов у начала звонка два, и оба законны: сервер открыл дверь («Отменить» — звоним) или
# отказал («Звонок завершён» с причиной — например, LiveKit не настроен). Второй не провал
# сценария: он тоже ответ, и снимок его сохраняет.
- extendedWaitUntil:
    visible: "Отменить"
    timeout: 20000
    optional: true
- extendedWaitUntil:
    visible: "Звонок завершён"
    timeout: 5000
    optional: true
- takeScreenshot: З1-звонок-начался

# ── Пока звонок идёт, окно 0 есть в переключателе ───────────────────────────
#
# Проверяется только на живом звонке: на отказе окно уже закрывается само.
- runFlow:
    when:
      visible: "Отменить"
    commands:
      # Отменить — а не «Завершить»: завершать ещё нечего, разговор не начался.
      - tapOn: "Отменить"
      - assertVisible:
          text: "Звонок завершён"
          timeout: 10000

- takeScreenshot: З1-звонок-завершён

# ── Закрытие возвращает туда, откуда пришли ─────────────────────────────────
#
# Оставить человека в окне, которого больше нет, — худший исход из возможных, поэтому
# проверяется именно возврат, а не только исчезновение кнопок.
- tapOn: "Закрыть"
- assertVisible:
    id: "tab:Chats"
    timeout: 10000

# И окна 0 снова нет: звонок кончился — окно ушло.
- tapOn: "Телефон"
- assertNotVisible: "Звонок"
- takeScreenshot: З1-окно-0-ушло
- tapOn: "✕"
