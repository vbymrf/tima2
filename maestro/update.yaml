# Обновление приложения из меню — сценарий О1.
#
# Зачем сценарий, а не руки: обновление — единственный путь, которым новая версия
# попадает к людям, и ломается он не в нашем коде, а на стыке с системой (установщик,
# Play Protect, права). Проверять его глазами каждый выпуск слишком дорого, а не
# проверять — значит выпускать вслепую.
#
# ── ПОЧЕМУ ОТБОР ПО НАДПИСЯМ, А НЕ ПО МЕТКАМ ────────────────────────────────
# Метки (`settings:UPDATE`) заведены в версии 10. А этот сценарий по своей природе
# начинается на СТАРОЙ версии — той, которую и предстоит обновить. На версии 9 меток
# нет ни одной: первый круг на Redmi упал именно так, и дерево упавшего шага показало
# 103 узла, из них ноль наших.
#
# Отсюда правило этого файла: до установки — только надписи. И язык до обновления
# обязан быть русский.
#
# ── ЧЕГО ЗДЕСЬ НЕТ И НЕ БУДЕТ ───────────────────────────────────────────────
# `clearState` стирает аккаунт. Обновление проверяется поверх живого устройства,
# иначе это проверка первой установки, а не обновления.
#
# ── КАК ЗАПУСКАТЬ ───────────────────────────────────────────────────────────
#   sh maestro/run.sh update.yaml
#
# Обёртка будит телефоны — без этого прогон падает так, что причина выглядит чужой:
# погасший экран дважды выдал себя за «Maestro не умеет параллельно» и за «драйвер не
# успевает встать по сетевому adb». Оба вывода оказались неверными, разбор — в README.
appId: io.tima.app.v2
---
- launchApp

# ── Вход: приложение встречает одним из двух экранов ─────────────────────────
#
# Если прошлый заход начал установку и не довёл её до конца, приложение открывается
# экраном «Обновление не завершилось» — и шестерёнки на нём нет вовсе. Поймано на
# втором круге разбора: шаг `tapOn "⚙"` упал, а снимок упавшего шага показал именно
# этот экран. Поэтому вход разветвлён, а не выпрямлен: выпрямленный работал бы только
# на телефоне, который никто до этого не трогал.
- runFlow:
    when:
      visible: "Обновление не завершилось"
    commands:
      - takeScreenshot: "О1-вход-незавершённое-обновление"
      # метка, надпись — запасной путь (ПЛАН-(МС)): ветка метки ставит флажок, запасная — только без него
      - runFlow:
          when:
            visible:
              id: "events:update"
          commands:
            - evalScript: ${output.tag_events_update = true}
            - tapOn:
                id: "events:update"
      - runFlow:
          when:
            true: ${!output.tag_events_update}
          commands:
            - tapOn: "Перейти к обновлению"

- runFlow:
    when:
      visible: "⚙"
    commands:
      # метка, надпись — запасной путь (ПЛАН-(МС)): ветка метки ставит флажок, запасная — только без него
      - runFlow:
          when:
            visible:
              id: "window:settings"
          commands:
            - evalScript: ${output.tag_window_settings = true}
            - tapOn:
                id: "window:settings"
      - runFlow:
          when:
            true: ${!output.tag_window_settings}
          commands:
            - tapOn: "⚙"
      - assertVisible: "Настройки"
      # Прокрутка, а не просто нажатие: 2026-09-16 в настройках появился
      # четырнадцатый пункт («Шрифты и размеры», ПЛАН-(Ш)-ШРИФТОВ Ш4), и «Обновление»
      # уехало за нижний край. На двух телефонах из трёх оно ещё влезало, на Samsung
      # уже нет — и параллельный прогон упал ровно на этом, а не на параллельности.
      - scrollUntilVisible:
          element: "Обновление"
          direction: DOWN
          timeout: 20000
      # метка, надпись — запасной путь (ПЛАН-(МС)): ветка метки ставит флажок, запасная — только без него
      - runFlow:
          when:
            visible:
              id: "settings:UPDATE"
          commands:
            - evalScript: ${output.tag_settings_UPDATE = true}
            - tapOn:
                id: "settings:UPDATE"
      - runFlow:
          when:
            true: ${!output.tag_settings_UPDATE}
          commands:
            - tapOn: "Обновление"

# Оба пути сошлись здесь: экран обновления открыт.
# Пара меток после шага (ПЛАН-(МО) МО3).
- runFlow:
    file: phone/flows/expect-screen.yaml
    env:
      SCREEN: "screen:settings.update"
      POPUP: "popup:none"
#
# Звёздочки не для красоты: **отбор по тексту у Maestro — полное совпадение по
# регулярному выражению, а не вхождение подстроки.** `assertVisible: "Установлена"`
# на узле «Установлена 2.0.9-dev-v2 (9)» не срабатывает вовсе. Стоило круга прогона.
- assertVisible: ".*Установлена.*"

# ── Что предложил сервер ─────────────────────────────────────────────────────
# Исходов два, и заранее неизвестно какой. Ожидание одно на оба: оно кончается, как только
# появился любой (ПЛАН-(МО) МО6). Раньше было два подряд, и в ветке «уже последняя» первое
# выжидало все 20 с кнопку «Обновить», которой не будет.
- extendedWaitUntil:
    visible: "Обновить|Установлена последняя версия"
    timeout: 20000
- takeScreenshot: "О1-что-предложил-сервер"

# ── Развилка: обновлять или уже нечего ───────────────────────────────────────
#
# Оба исхода — успех сценария, и это главное. Телефон, стоящий на последней версии,
# НЕ означает, что обновление сломано; он означает, что проверять здесь нечего. Прогон,
# который на этом краснеет, приучает смотреть на красное сквозь пальцы — а именно ради
# него сценарий и заводился.
#
# Снимок делается в обеих ветках: без него «нечего обновлять» неотличимо от «сценарий
# не туда зашёл».
#
# Ветка «уже последняя» — первой и ставит флажок, «обновить» идёт только без него: проверка
# «видно», а не «не видно» (ПЛАН-(МО) МО4) — «не видно» на экране, где надпись есть, ждёт
# около 8 с (PH-36).
- runFlow:
    when:
      visible: "Установлена последняя версия"
    commands:
      - evalScript: ${output.update_latest = true}
      - takeScreenshot: "О1-уже-последняя"
      # Доказательство, а не просто надпись: рядом с ней приложение печатает номер
      # работающей версии. Без этой проверки ветка прошла бы и на пустом экране.
      - assertVisible: ".*Установлена.*"

- runFlow:
    when:
      true: ${!output.update_latest}
    file: update-install.yaml
