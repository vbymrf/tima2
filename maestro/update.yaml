# Обновление приложения из меню — сценарий О1.
#
# Зачем сценарий, а не руки: обновление — единственный путь, которым новая версия
# попадает к людям, и ломается он не в нашем коде, а на стыке с системой (установщик,
# Play Protect, права). Проверять его глазами каждый выпуск слишком дорого, а не
# проверять — значит выпускать вслепую.
#
# ── ПОЧЕМУ ОТБОР ПО НАДПИСЯМ, А НЕ ПО МЕТКАМ ────────────────────────────────
# Метки (`settings:UPDATE`) заведены в версии 10. А этот сценарий по своей природе
# начинается на СТАРОЙ версии — той, которую и предстоит обновить. На версии 9 меток
# нет ни одной: первый круг на Redmi упал именно так, и дерево упавшего шага показало
# 103 узла, из них ноль наших.
#
# Отсюда правило этого файла: до установки — только надписи. И язык до обновления
# обязан быть русский.
#
# ── ЧЕГО ЗДЕСЬ НЕТ И НЕ БУДЕТ ───────────────────────────────────────────────
# `clearState` стирает аккаунт. Обновление проверяется поверх живого устройства,
# иначе это проверка первой установки, а не обновления.
#
# ── КАК ЗАПУСКАТЬ ───────────────────────────────────────────────────────────
#   MAESTRO_DRIVER_STARTUP_TIMEOUT=180000 \
#   maestro --device <адрес> test maestro/update.yaml
#
# Таймаут обязателен: по сетевому adb драйвер Maestro не успевает встать за
# отведённое по умолчанию время, и прогон виснет молча.
appId: io.tima.app.v2
---
- launchApp

# ── Вход: приложение встречает одним из двух экранов ─────────────────────────
#
# Если прошлый заход начал установку и не довёл её до конца, приложение открывается
# экраном «Обновление не завершилось» — и шестерёнки на нём нет вовсе. Поймано на
# втором круге разбора: шаг `tapOn "⚙"` упал, а снимок упавшего шага показал именно
# этот экран. Поэтому вход разветвлён, а не выпрямлен: выпрямленный работал бы только
# на телефоне, который никто до этого не трогал.
- runFlow:
    when:
      visible: "Обновление не завершилось"
    commands:
      - takeScreenshot: "О1-вход-незавершённое-обновление"
      - tapOn: "Перейти к обновлению"

- runFlow:
    when:
      visible: "⚙"
    commands:
      - tapOn: "⚙"
      - assertVisible: "Настройки"
      - tapOn: "Обновление"

# Оба пути сошлись здесь: экран обновления открыт.
#
# Звёздочки не для красоты: **отбор по тексту у Maestro — полное совпадение по
# регулярному выражению, а не вхождение подстроки.** `assertVisible: "Установлена"`
# на узле «Установлена 2.0.9-dev-v2 (9)» не срабатывает вовсе. Стоило круга прогона.
- assertVisible: ".*Установлена.*"

# ── Что предложил сервер ─────────────────────────────────────────────────────
# Исходов два, и заранее неизвестно какой, отсюда `optional`.
- extendedWaitUntil:
    visible: "Обновить"
    timeout: 20000
    optional: true
- extendedWaitUntil:
    visible: "Установлена последняя версия"
    timeout: 3000
    optional: true
- takeScreenshot: "О1-что-предложил-сервер"

# ── Наше предупреждение перед установкой ─────────────────────────────────────
# «Обновить» есть, когда пакет ещё не скачан; «Установить» — когда скачан прошлым
# заходом. Нажимаем то, что есть.
- runFlow:
    when:
      visible: "Обновить"
    commands:
      - tapOn: "Обновить"
      - extendedWaitUntil:
          visible: "Установить"
          timeout: 120000
      - takeScreenshot: "О1-предупреждение"

- tapOn: "Установить"

# ── Разрешение «Установка неизвестных приложений» ────────────────────────────
#
# Третье вендорское расхождение, и его не было ни на realme, ни на Redmi: там
# разрешение уже выдано с прошлых установок. На Samsung, куда приложение поставлено
# начисто, система вместо окна установщика уводит в НАСТРОЙКИ — «Разрешение для
# этого источника», переключатель `android:id/switch_widget`.
#
# Сам переключатель `clickable=false`; кликабельна строка вокруг него. Поэтому
# нажимаем надпись: её узел лежит внутри этой строки.
#
# Ветка, а не прямой шаг: на телефоне, где разрешение уже есть, экрана не будет.
- runFlow:
    when:
      visible: "Установка неизвестных приложений"
    commands:
      - takeScreenshot: "О1-разрешение-источника"
      - tapOn: "Разрешение для этого источника"
      # НЕ `back`: проверено на Samsung — он уходит не в приложение, а вглубь чужого
      # стека настроек (оказались в настройках Wi-Fi). Возвращаемся запуском.
      - launchApp
      - extendedWaitUntil:
          visible: "Установить"
          timeout: 30000
          optional: true
      - runFlow:
          when:
            visible: "Установить"
          commands:
            - tapOn: "Установить"

# ── Системное окно установщика ───────────────────────────────────────────────
#
# ЗДЕСЬ НЕЛЬЗЯ ПО ТЕКСТУ, И ЭТО ПРОВЕРЕНО НА ДВУХ ТЕЛЕФОНАХ:
#
#   Redmi (Android 14)  «Обновить приложение?»                 Отмена | Обновить
#   realme (Android 11) «Установить обновление для этого        ОТМЕНА | УСТАНОВИТЬ
#                        приложения? Вы не потеряете данные»
#
# Окно рисует не наше приложение, а системный установщик, и вендор переписывает в нём
# и вопрос, и надписи на кнопках. Сценарий, привязанный к тексту, работает на том
# телефоне, где его писали, и падает на соседнем — именно это и произошло.
#
# `android:id/button1` — положительная кнопка любого системного диалога Android.
# Идентификатор общий по платформе, вендор его не трогает.
- extendedWaitUntil:
    visible:
      id: "android:id/button1"
    timeout: 60000
- takeScreenshot: "О1-окно-системы"
- tapOn:
    id: "android:id/button1"

# ── Play Защита — ЕДИНСТВЕННОЕ МЕСТО, ГДЕ СЦЕНАРИЙ ВСТАЁТ ────────────────────
#
# Окно `com.android.vending/…PlayProtectDialogsActivity`: «Рекомендуется проверка
# приложения». Появилось на всех трёх телефонах.
#
# ЧТО В НЁМ ЕСТЬ. Свёрнутым оно предлагает два выхода: «Проверить» — отправить наш
# APK в Google — и «Не устанавливать». Ни один не годится: первый решает за заказчика
# вопрос, который за ним и остался (ВЕРСИИ/КЛИЕНТЫ.md, разбор 2026-09-06), второй
# отменяет обновление. Нужный третий — «Установить без проверки» — появляется только
# после нажатия на «Подробнее».
#
# ── ЧТО ПРОВЕРЕНО НА ТРЁХ ТЕЛЕФОНАХ 2026-09-15 ──────────────────────────────
#
# «Подробнее» Maestro находит и нажимает. Это отдельный узел, шаг проходит.
#
# «Установить без проверки» Maestro не находит — и это не свойство телефона, а
# устройство самого окна. Снято с дерева упавшего шага на Samsung:
#
#   узел [120,1249][960,1549]  clickable=false
#   текст: «Проверка может занять некоторое время. Ее результаты появятся на
#           экране. Подробнее о Play Защите…» — пустая строка — «Установить без
#           проверки»
#
# То есть нужная надпись — последняя СТРОКА внутри чужого текстового узла, а не узел.
# Отбор по тексту у Maestro полный: `"Установить без проверки"` не совпадает с этой
# строкой целиком и не находит ничего. Регулярка `.*Установить без проверки.*` нашла
# бы узел и нажала его ЦЕНТР — а центр (540, 1399) приходится на строку «Подробнее о
# Play Защите…», то есть на переход в справку.
#
# По проценту высоты экрана тоже не выйдет. Измерено:
#
#   Samsung  1080×2340   строка на y≈1520   65 %
#   realme    720×1600   строка на y≈1040   65 %
#   Redmi     720×1600   строка на y≈1081   68 %
#
# Два телефона сошлись, третий — нет: окно рисует Play Маркет, и его версия и
# раскладка у вендоров разные. Один процент промахнётся по Redmi.
#
# ── ЧТО ЭТО ЗНАЧИТ ──────────────────────────────────────────────────────────
# Сценарий доходит сюда сам и дальше требует человека — ровно один тык. Убрать его
# можно тремя способами, и выбор не наш:
#
#   1. отключить запрос Play Защиты на стендовых телефонах
#      (`settings put global package_verifier_user_consent -1`) — сценарий пойдёт
#      целиком и молча; это правка чужого устройства;
#   2. отправить сборку в Google на проверку — окно перестанет появляться само,
#      но наш APK уедет наружу;
#   3. оставить как есть: остановка здесь и один тык человека.
#
# Пока действует третий. Остановка сделана явной, а не падением по таймауту: в
# журнале видно причину, а не «элемент не найден».
- runFlow:
    when:
      visible: "Рекомендуется проверка приложения"
    commands:
      - takeScreenshot: "О1-play-защита-свёрнуто"
      - tapOn: "Подробнее"
      - takeScreenshot: "О1-play-защита-развёрнуто"
      - assertVisible: "ОСТАНОВКА: нажмите «Установить без проверки» — почему руками, написано выше"

# ── Доказательство: новая версия стоит и работает ────────────────────────────
#
# Приложение на время установки закрывается — система подменяет пакет. Поэтому
# запускаем заново и спрашиваем его же экран обновления.
#
# Проверяем «Установлена последняя версия», а НЕ номер: номер пришлось бы править
# каждый выпуск, и однажды его забудут поправить — тест позеленеет на старой версии.
# «Последняя» же означает ровно то, что нужно: устройство и сервер сошлись.
- launchApp
- extendedWaitUntil:
    visible: "⚙"
    timeout: 60000
- tapOn: "⚙"
- tapOn: "Обновление"
- extendedWaitUntil:
    visible: "Установлена последняя версия"
    timeout: 30000
- takeScreenshot: "О1-итог"
