# Элемент «Вход» звонящего, способ Maestro: «Контакты» → поиск по имени → «📹».
# Трубка в шапке переписки — голосовой звонок (PH-1), поэтому через «Контакты».
#
# Поиск, а не `rightOf: <имя>`: `rightOf` берёт любую кнопку правее имени без учёта строки,
# и 2026-09-29 Honor трижды позвонил первой строке списка вместо realme (PH-19). После
# поиска в списке одна строка — и одна кнопка «📹».
appId: io.tima.app.v2
# Значения — MAESTRO_QUERY (что набрать в поиске) и MAESTRO_PEER (строка собеседника,
# регулярное выражение); задаёт scenario.py. Своих умолчаний в `env:` нет (PH-15).
---
- launchApp:
    stopApp: false
- tapOn:
    id: "tab:Contacts"
# прежний запрос — стереть: он общий у «Чатов» и «Контактов»
# Метка, надпись — запасной путь (ПЛАН-(МС)).
- tapOn:
    id: "search:close"
    optional: true
- tapOn:
    text: "✕"
    optional: true
# метка, надпись — запасной путь (ПЛАН-(МС)): ветка метки ставит флажок, запасная — только без него
- runFlow:
    when:
      visible:
        id: "window:search"
    commands:
      - evalScript: ${output.tag_window_search = true}
      - tapOn:
          id: "window:search"
- runFlow:
    when:
      true: ${!output.tag_window_search}
    commands:
      - tapOn: "🔍"
- inputText: "${MAESTRO_QUERY}"
- extendedWaitUntil:
    visible:
      id: "book:video-call"
    timeout: 10000
- assertVisible:
    text: "${MAESTRO_PEER}"
    below: "Вид"
- tapOn:
    id: "book:video-call"
