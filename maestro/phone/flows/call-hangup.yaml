# Элемент «Выход», способ Maestro: положить трубку и закрыть окно звонка.
# «Завершить» на экране — значок трубки без подписи (PH-2).
appId: io.tima.app.v2
---
# подготовка run.sh оставляет рабочий стол (PH-16) — вернуть приложение с окном звонка
- launchApp:
    stopApp: false
# Метка, а не надпись (ПЛАН-(МС)): вид кнопки меняется, метка — нет. Надпись — запасной путь
# для сборки без метки. Учёт — doc_mig/ФУНКЦИОНАЛ/АВТОТЕСТЫ/СЦЕНАРИИ-ПО-ОКНАМ.md.
# метка, надпись — запасной путь (ПЛАН-(МС)): ветка метки ставит флажок, запасная — только без него
- runFlow:
    when:
      visible:
        id: "call:hangup"
    commands:
      - evalScript: ${output.tag_call_hangup = true}
      - tapOn:
          id: "call:hangup"
- runFlow:
    when:
      true: ${!output.tag_call_hangup}
    commands:
      - tapOn: "📞"
- extendedWaitUntil:
    visible: "Закрыть"
    timeout: 15000
# метка, надпись — запасной путь (ПЛАН-(МС)): ветка метки ставит флажок, запасная — только без него
- runFlow:
    when:
      visible:
        id: "call:close"
    commands:
      - evalScript: ${output.tag_call_close = true}
      - tapOn:
          id: "call:close"
- runFlow:
    when:
      true: ${!output.tag_call_close}
    commands:
      - tapOn: "Закрыть"
