# Элемент «Вход» принимающего, способ Maestro: дождаться «Принять» и нажать.
# Начинается с launchApp: подготовка run.sh кончается рабочим столом (PH-16), и входящий
# на нём приходит уведомлением, а не окном с «Принять» (проверено 2026-09-29, realme).
appId: io.tima.app.v2
---
- launchApp:
    stopApp: false
# Метка, а не надпись (ПЛАН-(МС)): вид кнопки меняется, метка — нет. Надпись — запасной путь
# для сборки без метки. Учёт — doc_mig/ФУНКЦИОНАЛ/АВТОТЕСТЫ/СЦЕНАРИИ-ПО-ОКНАМ.md.
- extendedWaitUntil:
    visible: "Принять"
    timeout: 120000
# Сначала — сборка без метки (надпись), потом метка: в обратном порядке после нажатия по
# метке кнопка пропадает, и запасная ветка нажала бы надпись где-то ещё (PH-10).
- runFlow:
    when:
      notVisible:
        id: "call:accept"
    commands:
      - tapOn: "Принять"
- runFlow:
    when:
      visible:
        id: "call:accept"
    commands:
      - tapOn:
          id: "call:accept"
