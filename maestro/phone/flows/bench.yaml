# Элемент «Прогон в окне стенда», способ Maestro: забег вооружён, выбран набор PRESET,
# на экране «Прогон EXPECT». Потом — назад в главное окно: «Назад» из стенда закрывает
# приложение (PH-3), поэтому сразу launchApp.
appId: io.tima.app.v2
# Значения — переменными окружения MAESTRO_<ИМЯ> (их задаёт scenario.py). Своих умолчаний
# в `env:` нет: блок `env:` задаёт переменную заново и перекрывает переданное (PH-15).
---
- launchApp:
    stopApp: false
# Метка, а не надпись (ПЛАН-(МС)): вид меняется, метка — нет. Надпись — запасной путь для
# сборки без метки. Учёт — doc_mig/ФУНКЦИОНАЛ/АВТОТЕСТЫ/СЦЕНАРИИ-ПО-ОКНАМ.md.
#
# Окно стенда может быть уже открыто (приложение возвращается туда, где его оставили) —
# тогда шапки окна нет, и идти через переключатель не нужно. Шапка с меткой есть у любого
# окна, а не только у «Телефона».
- runFlow:
    when:
      visible:
        id: "window:switcher"
    commands:
      - evalScript: ${output.tag_window_switcher = true}
      - tapOn:
          id: "window:switcher"
      # На Redmi список окон длиннее экрана — «Стенд звонков» ниже края (PH-12).
      - scrollUntilVisible:
          element:
            id: "switcher:Bench"
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: "switcher:Bench"
# Сборка без меток — прежний путь по надписям. Только без флажка ветки меток: проверка
# «не видно» на экране, где метка есть, ждёт секунды (2026-10-09), флажок — нет.
- runFlow:
    when:
      true: ${!output.tag_window_switcher}
    commands:
      - runFlow:
          when:
            visible: "Телефон"
          commands:
            - tapOn: "Телефон"
            - scrollUntilVisible:
                element: "Стенд звонков"
                direction: DOWN
                timeout: 10000
            - tapOn: "Стенд звонков"
# Пара меток после шага (ПЛАН-(МО) МО3): окно стенда открыто.
- runFlow:
    file: expect-screen.yaml
    env:
      SCREEN: "screen:Bench"
      POPUP: "popup:none"
# Клавиатуру от прошлого раза прячет scenario.py до запуска (adb, PH-20): hideKeyboard
# Maestro на Redmi открывал шторку уведомлений (PH-21).
# окно стенда помнит прокрутку — кнопка вооружения вверху может быть за краем.
# Жест — из середины: scrollUntilVisible вверх начинает от края и на Redmi тянет шторку
# уведомлений (PH-21).
#
# Проверка «видно», а не «не видно» (ПЛАН-(МО) МО4): обычно кнопка уже на экране, и «видно»
# отвечает сразу; «не видно» на экране, где кнопка есть, ждало около 8 с (PH-36). Нашли —
# флажок, свайпы только без него. Метка, а нет — надпись.
- runFlow:
    when:
      visible:
        id: "bench:(arm|disarm)"
    commands:
      - evalScript: ${output.bench_top = true}
- runFlow:
    when:
      true: ${!output.bench_top}
    commands:
      - runFlow:
          when:
            visible: "(Начать|Остановить) прогон"
          commands:
            - evalScript: ${output.bench_top = true}
- repeat:
    times: 8
    while:
      true: ${!output.bench_top}
    commands:
      - swipe:
          start: 50%, 35%
          end: 50%, 85%
          duration: 300
      - runFlow:
          when:
            visible: "(Начать|Остановить) прогон"
          commands:
            - evalScript: ${output.bench_top = true}
# «Начать прогон» в окне дважды — заголовок раздела и кнопка; метка стоит только на кнопке (PH-29).
- runFlow:
    when:
      visible:
        id: "bench:arm"
    commands:
      - evalScript: ${output.tag_bench_arm = true}
      - tapOn:
          id: "bench:arm"
- runFlow:
    when:
      visible:
        id: "bench:disarm"
    commands:
      - evalScript: ${output.tag_bench_arm = true}
# Сборка без меток — по надписи, только без флажка ветки меток.
- runFlow:
    when:
      true: ${!output.tag_bench_arm}
    commands:
      - runFlow:
          when:
            visible: "Начать прогон"
          commands:
            - tapOn: "Начать прогон"
- assertVisible: "Остановить прогон"
# Имя набора стоит дважды: в поле названия (выше строки «Прогон N из M») и на плашке
# (ниже неё). Первое совпадение — поле, нажатие в него открывает клавиатуру (2026-09-29).
- scrollUntilVisible:
    element:
      text: "${MAESTRO_PRESET}"
      below: 'Прогон \d+ из \d+'
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "${MAESTRO_PRESET}"
    below: 'Прогон \d+ из \d+'
- assertVisible: "${MAESTRO_EXPECT}"
- takeScreenshot: "bench-selected"
- back
- launchApp:
    stopApp: false
- assertVisible:
    id: "tab:Chats"
