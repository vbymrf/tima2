# Закрыть окно звонка у того, кто трубку не клал.
appId: io.tima.app.v2
---
# подготовка run.sh оставляет рабочий стол (PH-16) — вернуть приложение с окном звонка
- launchApp:
    stopApp: false
# Метка, а не надпись (ПЛАН-(МС)): вид кнопки меняется, метка — нет. Надпись — запасной путь
# для сборки без метки. Учёт — doc_mig/ФУНКЦИОНАЛ/АВТОТЕСТЫ/СЦЕНАРИИ-ПО-ОКНАМ.md.
# Ждём дольше, чем у кладущего: «Закрыть» здесь появляется, когда трубку положит **другой**
# телефон, а его сценарий стартует одновременно с этим и идёт через свою подготовку. 15 с не
# хватало: 2026-10-09 ожидание кончилось в 07:51:39, «Завершить» там нажато в 07:51:51.
- extendedWaitUntil:
    visible: "Закрыть"
    timeout: 90000
# Пара меток после шага (ПЛАН-(МО) МО3): окно звонка в конце.
- runFlow:
    file: expect-screen.yaml
    env:
      SCREEN: "screen:call.ended"
      POPUP: "popup:none"
# метка, надпись — запасной путь (ПЛАН-(МС)): ветка метки ставит флажок, запасная — только без него
- runFlow:
    when:
      visible:
        id: "call:close"
    commands:
      - evalScript: ${output.tag_call_close = true}
      - tapOn:
          id: "call:close"
- runFlow:
    when:
      true: ${!output.tag_call_close}
    commands:
      - tapOn: "Закрыть"
