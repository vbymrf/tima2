# Закрыть окно звонка у того, кто трубку не клал.
appId: io.tima.app.v2
---
# подготовка run.sh оставляет рабочий стол (PH-16) — вернуть приложение с окном звонка
- launchApp:
    stopApp: false
# Метка, а не надпись (ПЛАН-(МС)): вид кнопки меняется, метка — нет. Надпись — запасной путь
# для сборки без метки. Учёт — doc_mig/ФУНКЦИОНАЛ/АВТОТЕСТЫ/СЦЕНАРИИ-ПО-ОКНАМ.md.
- extendedWaitUntil:
    visible: "Закрыть"
    timeout: 15000
# Сначала — сборка без метки (надпись), потом метка: в обратном порядке после нажатия по
# метке кнопка пропадает, и запасная ветка нажала бы надпись где-то ещё (PH-10).
- runFlow:
    when:
      notVisible:
        id: "call:close"
    commands:
      - tapOn: "Закрыть"
- runFlow:
    when:
      visible:
        id: "call:close"
    commands:
      - tapOn:
          id: "call:close"
