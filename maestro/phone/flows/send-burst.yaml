# Пачка сообщений одному собеседнику — проверка «звук один на пачку» (ПЛАН-(ЖУ)-ЖУРНАЛА-УВЕДОМЛЕНИЙ ЖУ3, ЖУ7).
#
# Через Maestro, а не `adb input`: поле ввода Compose касанием adb фокус не берёт (2026-09-30,
# realme — текст уходил мимо, а касания после «Назад» попадали на рабочий стол).
# Поле и кнопка отправки — по меткам `chat:input`, `chat:send` (сборки после 163). Запасной надписи у них
# нет: стрелка нарисована, подсказка поля в дерево не попадает. Точки и `rightOf` пробовались
# 2026-10-09 и не работают (PH-40…42 навыка телефонов), поэтому на сборке без меток сценарий
# падает на первой проверке, а не шлёт касания мимо.
appId: io.tima.app.v2
# MAESTRO_PEER — строка собеседника в «Чатах»; MAESTRO_TIMES — сколько сообщений.
---
- launchApp:
    stopApp: false
# Приложение могло остаться в переписке или на странице человека — назад до окна «Телефон».
# Проверка «видно» с флажком, а не «пока не видно» (ПЛАН-(МО) МО4): обычно телефон уже в главном
# окне, и «видно» отвечает сразу, а «не видно» на таком экране ждало около 8 с (PH-36).
- runFlow:
    when:
      visible:
        id: "screen:Phone\\..*"
    commands:
      - evalScript: ${output.atPhone = true}
- repeat:
    while:
      true: ${!output.atPhone}
    times: 4
    commands:
      - back
      - launchApp:
          stopApp: false
      - runFlow:
          when:
            visible:
              id: "screen:Phone\\..*"
          commands:
            - evalScript: ${output.atPhone = true}
# Поверх «Телефона» может быть подокно (переключатель окон подменяет весь экран, вкладок под
# ним не видно) — сначала пара: любая вкладка «Телефона», подокно закрыть (ПЛАН-(МО) МО5).
- runFlow:
    file: expect-screen.yaml
    env:
      SCREEN: "screen:Phone\\..*"
      POPUP: "popup:none"
- tapOn:
    id: "tab:Chats"
- runFlow:
    file: expect-screen.yaml
    env:
      SCREEN: "screen:Phone.Chats"
      POPUP: "popup:none"
- tapOn:
    text: "${MAESTRO_PEER}"
    below: "Вид"
# Касание по имени в «Чатах» открывает страницу человека — с неё «Написать».
- tapOn:
    id: "page:write"
    optional: true
# Сборка без метки — по надписи.
- tapOn:
    text: "Написать"
    optional: true
# Признак переписки — метка поля ввода и пара меток экрана (ПЛАН-(МО) МО3).
- extendedWaitUntil:
    visible:
      id: "chat:input"
    timeout: 10000
- runFlow:
    file: expect-screen.yaml
    env:
      SCREEN: "screen:chat"
      POPUP: "popup:none"
# Без `hideKeyboard`: на Samsung он нажимает «Назад» и закрывает переписку (PH-40). Кнопка
# отправки при открытой клавиатуре уезжает вверх вместе с полем — метка находит её там.
# Текст латиницей и с номером: кириллица в поле не вводилась (PH-41), номер отличает
# сообщения пачки друг от друга в проверке.
- tapOn:
    id: "chat:input"
- eraseText
- evalScript: ${output.burst = 0}
- repeat:
    times: ${MAESTRO_TIMES}
    commands:
      - evalScript: ${output.burst = output.burst + 1}
      - tapOn:
          id: "chat:input"
      - inputText: "burst ${output.burst}"
      - tapOn:
          id: "chat:send"
# Переписка открыта, последнее сообщение в ней — иначе касания ушли мимо, а сценарий прошёл бы
# зелёным (2026-10-09).
- assertVisible:
    id: "chat:input"
# При открытой клавиатуре список не прокручивается к новому сообщению — последнее остаётся ниже
# края (realme, 2026-10-09): ищется прокруткой вниз, а не ожиданием на экране. Проверка того, что
# пачка дошла, — журнал получателя (приём на каждое сообщение, «значок сменился» — один раз).
- scrollUntilVisible:
    element:
      text: "burst ${output.burst}"
    direction: DOWN
    timeout: 10000
