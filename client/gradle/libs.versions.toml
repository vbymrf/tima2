# Единый каталог версий. Версии взяты из v1 (тег ref/client-v1) — они собирались,
# а не выбраны по свежести: замена версии здесь становится отдельной задачей с
# проверкой в CI, а не побочным эффектом чужой правки.

[versions]
kotlin = "2.3.10"
agp = "8.13.2"
compose = "1.11.1"
activityCompose = "1.9.3"
# SQLDelight — выбран ADR-0001. Версии из v1 здесь нет: v1 работал с sqlite-jdbc
# напрямую, то есть наследовать было нечего. Взята последняя 2.x на 2026-08-21.
sqldelight = "2.3.2"
# Ktor — версия из v1 (тег ref/client-v1, composeApp/build.gradle.kts): она
# собиралась и работала в живой сети. Замена — отдельная задача с прогоном.
ktor = "3.5.1"
# Корутины нужны только тестам транспорта: сам он suspend-функции берёт от Ktor.
coroutines = "1.10.2"
serialization = "1.7.3"

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
# Драйверы по платформам: своя реализация под каждую, общего кода они не касаются.
sqldelight-driver-jvm = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
# Движки: OkHttp на JVM и Android, Darwin на Apple. Общий код их не видит.
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
# MockEngine: проверка транспорта без сети и без сервера.
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
