org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── Версия приложения: ОДНО место на все сборки ─────────────────────────────
#
# До 2026-08-26 versionCode и versionName стояли литералами в app-android, а
# десктоп версии не знал вовсе — и показывал «Установлена —». Три источника
# расходятся молча: сервер сравнивает номер с тем, чего ни у кого нет.
#
# Поток сборок нужен здесь же. Номера версий сравнимы ТОЛЬКО внутри потока: v1
# дошла до 24, v2 начала с 1, и «24 больше 2» предложило бы поставить поверх
# новой версии прошлогоднюю.
tima.versionCode=2
tima.versionName=2.0.1-dev
tima.stream=v2
