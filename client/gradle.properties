org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── Версия приложения: ОДНО место на все сборки ─────────────────────────────
#
# До 2026-08-26 versionCode и versionName стояли литералами в app-android, а
# десктоп версии не знал вовсе — и показывал «Установлена —». Три источника
# расходятся молча: сервер сравнивает номер с тем, чего ни у кого нет.
#
# Поток сборок нужен здесь же. Номера версий сравнимы ТОЛЬКО внутри потока: v1
# дошла до 24, v2 начала с 1, и «24 больше 2» предложило бы поставить поверх
# новой версии прошлогоднюю.
tima.versionCode=62
tima.versionName=2.0.62-dev
tima.stream=v2

# ── Номер тестовой сборки ───────────────────────────────────────────────────
#
# Правило заказчика 2026-09-19. Версия поднимается ОДИН раз в начале работы и
# уже не меняется; проверочные сборки той же работы отличаются номером теста:
# 2.0.40-dev-t1, -t2, -t3. Готовая — без номера.
#
# Ноль в репозитории: что лежит в ветке, то и готовое. Задаётся в командной
# строке (`-Ptima.test=2`) и сюда не коммитится. Правило — ВЕРСИИ/КЛИЕНТЫ.md.
tima.test=0
