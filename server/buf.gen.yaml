# Кодоген Go-классов из контрактных схем ../schema/proto (ADR-0009).
# Генерённый код коммитится (internal/proto); перегенерация — scripts/gen-proto.sh.
# Пакет Go задаётся опцией M плагина, а не managed-режимом: managed у новых buf дописывает
# в дескриптор опции чужих языков, и без изменений схемы файлы перестают совпадать.
version: v2
plugins:
  - local: protoc-gen-go
    out: internal/proto
    opt:
      - paths=source_relative
      - Menvelope.proto=tima/server/internal/proto
      - Mmessage_body.proto=tima/server/internal/proto
