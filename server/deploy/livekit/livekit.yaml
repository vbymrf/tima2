# LiveKit SFU для звонков и аудио-чатов TIMA (ADR-0006).
# ВАЖНО: ключ/секрет ДОЛЖНЫ совпадать с LIVEKIT_API_KEY/SECRET в deploy/.env —
# бэкенд подписывает токены доступа этим же секретом. Подставь их вручную ниже.
port: 7880
#
# ── Качество медиа: названо осознанно (З7 в doc_mig/ПЛАН-ЗВОНКОВ.md) ─────────
#
# До 2026-09-19 секции congestion_control не было вовсе, и поведение на плохой
# связи получалось из умолчаний LiveKit, а не из решения. Значения выписаны ВСЕ,
# даже совпадающие с умолчанием: так видно, что выбрано, а что просто совпало.
#
# Правило то же, что у room ниже: раз качество отдано LiveKit (ADR-0006), задать
# его надо осознанно. Поправка-2 к тому же ADR на время испытаний разрешает нам
# свои пресеты и пороги — но это про КЛИЕНТА, за флагом; сервер настраивается тут.
#
# ВСЁ ЭТО — ОДИН БЛОК rtc. Второй `rtc:` в файле молча съел бы первый вместе с
# портами: YAML при повторе ключа берёт последний, и SFU остался бы без диапазона
# UDP и без анонса внешнего адреса. Поймано при сборке этой секции 2026-09-19.
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true        # WebRTC: анонсировать публичный IP VPS

  # Переход на TCP, когда UDP не проходит. В сетях с агрессивным DPI это разница
  # между «звонки не работают» и «работают хуже».
  allow_tcp_fallback: true

  congestion_control:
    enabled: true

    # РЕШЕНИЕ ЗАКАЗЧИКА 2026-09-19: разрешаем SFU гасить видео совсем.
    #
    # Умолчание LiveKit — false: видео ухудшается до нижнего слоя, но не пропадает.
    # Выбрано true: когда полосы нет, честнее оставить звук и убрать картинку, чем
    # давить звук нижним слоем видео. Следствие, которое ОБЯЗАН закрыть клиент:
    # картинка пропадает без нашего участия, и человеку надо об этом сказать —
    # иначе это выглядит как поломка. Это З9 в плане звонков.
    allow_pause: true

    # Оценщик полосы: по отчётам получателя (remote) или по TWCC со стороны
    # отправителя (send-side). Оставлен remote — умолчание LiveKit. Send-side
    # обычно точнее на мобильных сетях, но включать его без замера — гадание
    # (З-В2 в плане звонков).
    use_send_side_bwe: false

    # Нижняя граница полосы: 0 — без границы, опускаемся сколько нужно.
    # Умолчание.
    stream_allocator:
      min_channel_capacity: 0
keys:
  # ЗАМЕНИ на значения из .env (LIVEKIT_API_KEY: LIVEKIT_API_SECRET):
  REPLACE_LIVEKIT_API_KEY: REPLACE_LIVEKIT_API_SECRET

# Умолчания комнаты. Раз тайминги отданы LiveKit (ADR-0006 Поправка-1), задать их
# надо осознанно, а не оставлять «как выйдет».
room:
  # Пустая комната живёт ещё столько после ухода последнего — окно на возвращение
  # выпавшего в групповом звонке.
  empty_timeout: 300
  # Сколько держим участника после разрыва транспорта, прежде чем считать ушедшим.
  # ЭТО и есть «30 секунд восстановления связи»: они живут здесь, а не в коде
  # клиента и не в бэкенде — своих таймеров поверх SFU мы не заводим.
  departure_timeout: 30
  max_participants: 20         # лимит MVP (NFR, calls-livekit.md §2)

video:
  # Через сколько перестать кодировать слой, который никто не смотрит (Dynacast).
  # Умолчание LiveKit. Названо здесь, потому что от него зависит исходящий трафик
  # публикующего, а это то, что мы меряем.
  dynacast_pause_delay: 5s

# Вебхуки — источник правды о составе комнаты. Бэкенд своего учёта «жив или нет»
# не ведёт: SFU решает это сам, с учётом реконнектов.
#
# Адрес — 127.0.0.1, а НЕ имя backend: LiveKit работает в host-сети (ему нужны
# настоящие UDP-порты WebRTC) и имён docker-compose не видит. С именем все вебхуки
# падали на резолве и выбрасывались по возрасту — проверено нагрузочным прогоном.
webhook:
  api_key: REPLACE_LIVEKIT_API_KEY   # тем же ключом подписывается вебхук
  urls:
    - http://127.0.0.1:8080/livekit/webhook

# TURN обязателен. Без него участник за строгим NAT или симметричным файрволом
# просто не подключится. На звонке один на один это иногда проскакивает, а в группе
# из пяти человек вероятность, что кому-то не повезёт, становится высокой — и
# выглядеть будет как «у вас звонки не работают», хотя код ни при чём.
#
# Порты TURN нужно открыть в файрволе VPS: ufw allow 3478/udp && ufw allow 5349/tcp.
# Для TLS-варианта нужен сертификат на turn.<домен> — до его выписки достаточно
# udp/3478, он закрывает большинство случаев строгого NAT.
turn:
  enabled: true
  domain: REPLACE_TURN_DOMAIN  # turn.<ваш домен>
  udp_port: 3478
