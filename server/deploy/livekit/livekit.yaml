# LiveKit SFU для звонков и аудио-чатов TIMA (ADR-0006).
# ВАЖНО: ключ/секрет ДОЛЖНЫ совпадать с LIVEKIT_API_KEY/SECRET в deploy/.env —
# бэкенд подписывает токены доступа этим же секретом. Подставь их вручную ниже.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true        # WebRTC: анонсировать публичный IP VPS
keys:
  # ЗАМЕНИ на значения из .env (LIVEKIT_API_KEY: LIVEKIT_API_SECRET):
  REPLACE_LIVEKIT_API_KEY: REPLACE_LIVEKIT_API_SECRET

# Умолчания комнаты. Раз тайминги отданы LiveKit (ADR-0006 Поправка-1), задать их
# надо осознанно, а не оставлять «как выйдет».
room:
  # Пустая комната живёт ещё столько после ухода последнего — окно на возвращение
  # выпавшего в групповом звонке.
  empty_timeout: 300
  # Сколько держим участника после разрыва транспорта, прежде чем считать ушедшим.
  # ЭТО и есть «30 секунд восстановления связи»: они живут здесь, а не в коде
  # клиента и не в бэкенде — своих таймеров поверх SFU мы не заводим.
  departure_timeout: 30
  max_participants: 20         # лимит MVP (NFR, calls-livekit.md §2)

# Вебхуки — источник правды о составе комнаты. Бэкенд своего учёта «жив или нет»
# не ведёт: SFU решает это сам, с учётом реконнектов.
webhook:
  api_key: REPLACE_LIVEKIT_API_KEY   # тем же ключом подписывается вебхук
  urls:
    - http://backend:8080/livekit/webhook

# TURN обязателен. Без него участник за строгим NAT или симметричным файрволом
# просто не подключится. На звонке один на один это иногда проскакивает, а в группе
# из пяти человек вероятность, что кому-то не повезёт, становится высокой — и
# выглядеть будет как «у вас звонки не работают», хотя код ни при чём.
#
# Порты TURN нужно открыть в файрволе VPS: ufw allow 3478/udp && ufw allow 5349/tcp.
# Для TLS-варианта нужен сертификат на turn.<домен> — до его выписки достаточно
# udp/3478, он закрывает большинство случаев строгого NAT.
turn:
  enabled: true
  domain: REPLACE_TURN_DOMAIN  # turn.<ваш домен>
  udp_port: 3478
