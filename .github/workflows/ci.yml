# CI проекта TIMA. До 2026-08-20 в репозитории не было ни одного прогона:
# «Konsist в CI» из канона запускать было негде, а клиент собирался только на
# машине сборки. Здесь это исправляется, и заодно CI становится ОСНОВНЫМ гейтом:
# на машине разработки нет ни Android SDK, ни Go, ни железа Apple.
#
# ── КАК ЗДЕСЬ УСТРОЕНА ДИАГНОСТИКА ────────────────────────────────────────────
# Логи прогонов через API отдаются только с токеном; без токена доступны состояния
# шагов и АННОТАЦИИ. Поэтому:
#
#   1. шаг делает по одному действию и назван тем, что делает — имя упавшего шага
#      локализует поломку;
#   2. вывод Gradle перехватывается, и при падении его хвост печатается командами
#      `::error::` — то есть превращается в аннотации, читаемые без токена.
#
# Это не стилистика: без этого падение выглядит как «exit code 1» и не говорит
# ничего. Проверено на первом прогоне.

name: CI

on:
  push:
    branches: [stand, main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Клиент v2: общий код и JVM-таргет ──────────────────────────────────────
  client-jvm:
    name: client · JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 'jvm · сборка и тесты'
        working-directory: client
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee /tmp/gradle.log
      - name: 'jvm · вывод Gradle в аннотации'
        if: failure()
        run: tail -n 50 /tmp/gradle.log | while IFS= read -r l; do echo "::error::$l"; done

  # ── Клиент v2: iOS ────────────────────────────────────────────────────────
  # Матрица по задачам: видно не «iOS упал», а какая именно задача упала.
  client-ios:
    name: 'client · iOS ${{ matrix.task }}'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - ':core:core-model:compileKotlinIosSimulatorArm64'
          - ':core:core-model:iosSimulatorArm64Test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 'ios · окружение'
        run: |
          echo "arch: $(uname -m)"
          xcodebuild -version || echo "xcodebuild отсутствует"
          xcrun --sdk iphonesimulator --show-sdk-version || echo "SDK симулятора отсутствует"
      - name: 'ios · ${{ matrix.task }}'
        working-directory: client
        run: |
          set -o pipefail
          ./gradlew ${{ matrix.task }} --console=plain 2>&1 | tee /tmp/gradle.log
      - name: 'ios · вывод Gradle в аннотации'
        if: failure()
        run: tail -n 60 /tmp/gradle.log | while IFS= read -r l; do echo "::error::$l"; done

  # ── Спайк К1.4: зависимости крипто под iOS ────────────────────────────────
  spike-ios-deps:
    name: 'спайк · ${{ matrix.task }}'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - ':core:spike-ios-deps:jvmTest'
          - ':core:spike-ios-deps:iosSimulatorArm64Test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 'спайк · ${{ matrix.task }}'
        working-directory: client
        run: |
          set -o pipefail
          ./gradlew ${{ matrix.task }} --console=plain 2>&1 | tee /tmp/gradle.log
      - name: 'спайк · вывод Gradle в аннотации'
        if: failure()
        run: tail -n 60 /tmp/gradle.log | while IFS= read -r l; do echo "::error::$l"; done

  # ── Архитектурные правила (Plan.md §2.2) ──────────────────────────────────
  architecture:
    name: архитектурные правила
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 'правила · прогон'
        working-directory: client
        run: |
          set -o pipefail
          ./gradlew :architecture-tests:test --console=plain 2>&1 | tee /tmp/gradle.log
      - name: 'правила · вывод в аннотации'
        if: failure()
        run: tail -n 60 /tmp/gradle.log | while IFS= read -r l; do echo "::error::$l"; done

  # ── Крипто-ядро: не тронуто рефакторингом, служит опорной точкой ───────────
  crypto:
    name: messenger-crypto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 'крипто · компиляция'
        working-directory: messenger-crypto
        run: |
          set -o pipefail
          ./gradlew compileTestKotlin --console=plain 2>&1 | tee /tmp/gradle.log
      - name: 'крипто · тесты, включая сверку с BouncyCastle'
        working-directory: messenger-crypto
        run: |
          set -o pipefail
          ./gradlew test --console=plain 2>&1 | tee -a /tmp/gradle.log
      - name: 'крипто · вывод Gradle в аннотации'
        if: failure()
        run: tail -n 60 /tmp/gradle.log | while IFS= read -r l; do echo "::error::$l"; done
      - name: 'крипто · упавшие тесты в аннотации'
        if: failure()
        working-directory: messenger-crypto
        run: |
          for f in build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            grep -q '<failure' "$f" || continue
            echo "::error::упал класс $(basename "$f")"
            grep -o '<failure message="[^"]\{0,300\}"' "$f" | head -3 |
              while IFS= read -r l; do echo "::error::$l"; done
          done

  # ── Сервер: сборка и статический разбор ───────────────────────────────────
  server:
    name: server · build + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: 'сервер · сборка'
        working-directory: server
        run: go build ./...
      - name: 'сервер · vet'
        working-directory: server
        run: go vet ./...
