# CI проекта TIMA. До 2026-08-20 в репозитории не было ни одного прогона:
# «Konsist в CI» из канона запускать было негде, а клиент собирался только на
# машине сборки. Здесь это исправляется, и заодно CI становится ОСНОВНЫМ гейтом:
# на машине разработки нет ни Android SDK, ни Go, ни железа Apple.
#
# ── КАК ЗДЕСЬ УСТРОЕНА ДИАГНОСТИКА ────────────────────────────────────────────
# Логи прогонов через API отдаются только с токеном; без токена доступны состояния
# шагов и АННОТАЦИИ. Отсюда три приёма, и каждый добыт разбором предыдущего
# прогона, а не выбран заранее:
#
#   1. шаг делает по одному действию и назван тем, что делает — имя упавшего шага
#      локализует поломку. Так нашлось, что «упали тесты крипто» — это `exit 126`,
#      то есть отсутствие бита исполнения у gradlew;
#   2. вывод Gradle перехватывается в файл и при падении печатается командой
#      `::error::`, потому что «Process completed with exit code 1» не говорит
#      ничего;
#   3. аннотаций на шаг отдаётся не больше десяти, и по строке на аннотацию их
#      съедает баннер загрузки Gradle. Поэтому значимые строки собираются в ОДНО
#      сообщение через %0A.

name: CI

on:
  push:
    branches: [stand, main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Заслон: бит исполнения у gradlew ──────────────────────────────────────
  # За одну смену это ломало прогон трижды: git на Windows не хранит бит
  # исполнения, файл коммитится как 100644, и задача падает с «Permission
  # denied» — то есть красным становится не код, а обёртка. Проверка стоит
  # секунду и ловит это до того, как сгорит цикл CI.
  guard-exec-bits:
    name: 'заслон · биты исполнения'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'gradlew обязан быть исполняемым'
        run: |
          bad=$(git ls-files -s '*gradlew' | awk '$1 != "100755" {print $4}')
          if [ -n "$bad" ]; then
            echo "::error::не исполняемые gradlew:%0A$(echo "$bad" | awk '{printf "%s%%0A", $0}')%0AПочинить: git update-index --chmod=+x <файл>"
            exit 1
          fi
          echo "все gradlew исполняемые: $(git ls-files '*gradlew' | wc -l) шт."

  # ── Клиент v2: общий код и JVM-таргет ──────────────────────────────────────
  client-jvm:
    name: client · JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 'jvm · сборка и тесты'
        working-directory: client
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee /tmp/gradle.log
      - name: 'jvm · вывод Gradle в аннотацию'
        if: failure()
        run: |
          msg=$(grep -aE 'error:|FAILURE:|What went wrong|Caused by|not found|Could not|Unresolved|Cannot|^> |^e: ' /tmp/gradle.log | tail -n 30 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          if [ -z "$msg" ]; then msg=$(tail -n 25 /tmp/gradle.log | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}'); fi
          echo "::error::${msg}"
      - name: 'jvm · упавшие тесты в аннотацию'
        if: failure()
        working-directory: client
        run: |
          # Имена и сообщения упавших тестов из XML-отчётов. В выводе Gradle их нет:
          # он говорит «There were failing tests. See the report at file://…», а файл
          # на раннере мне недоступен.
          f=$(find . -path '*/build/test-results/*' -name '*.xml' 2>/dev/null | head -n 40)
          [ -z "$f" ] && { echo "::error::XML-отчётов тестов не найдено"; exit 0; }
          msg=$(grep -ho 'testcase name="[^"]*"' $f | head -n 8 | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          det=$(grep -hoE '(message|type)="[^"]{0,200}"' $f | grep -v 'type="junit' | head -n 10 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          echo "::error::упавшие тесты:%0A${msg}%0A${det}"

  # ── Клиент v2: iOS ────────────────────────────────────────────────────────
  client-ios:
    name: 'client · iOS'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 'ios · окружение'
        run: |
          echo "arch: $(uname -m)"
          xcodebuild -version || echo "xcodebuild отсутствует"
          xcrun --sdk iphonesimulator --show-sdk-version || echo "SDK симулятора отсутствует"
      # Имена задач Kotlin/Native не угадываем: спрашиваем у Gradle и печатаем
      # ответ аннотацией. В прогоне 2 `compileKotlinIosSimulatorArm64` упал, а
      # зависящий от него `iosSimulatorArm64Test` прошёл — значит имя не то.
      - name: 'ios · какие задачи вообще есть'
        working-directory: client
        run: |
          set -o pipefail
          ./gradlew :core:core-model:tasks --all --console=plain 2>&1 | tee /tmp/tasks.log || true
          msg=$(grep -aiE '^(compile|link|ios)[A-Za-z0-9]*' /tmp/tasks.log | head -n 25 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          echo "::notice::задачи core-model:%0A${msg}"
      - name: 'ios · тесты на симуляторе'
        working-directory: client
        run: |
          set -o pipefail
          ./gradlew iosSimulatorArm64Test --console=plain 2>&1 | tee /tmp/gradle.log
      - name: 'ios · вывод Gradle в аннотацию'
        if: failure()
        run: |
          msg=$(grep -aE 'error:|FAILURE:|What went wrong|Caused by|not found|Could not|Unresolved|Cannot|^> |^e: ' /tmp/gradle.log | tail -n 30 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          if [ -z "$msg" ]; then msg=$(tail -n 25 /tmp/gradle.log | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}'); fi
          echo "::error::${msg}"

  # ── Архитектурные правила (Plan.md §2.2) ──────────────────────────────────
  architecture:
    name: архитектурные правила
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 'правила · прогон'
        working-directory: client
        run: |
          set -o pipefail
          ./gradlew :architecture-tests:test --console=plain 2>&1 | tee /tmp/gradle.log
      - name: 'правила · вывод в аннотацию'
        if: failure()
        run: |
          msg=$(grep -aE 'Нарушений|нарушение|error:|FAILURE:|What went wrong|Caused by|not found|Could not|^> |^e: ' /tmp/gradle.log | tail -n 30 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          if [ -z "$msg" ]; then msg=$(tail -n 25 /tmp/gradle.log | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}'); fi
          echo "::error::${msg}"

  # ── Крипто-ядро: не тронуто рефакторингом, служит опорной точкой ───────────
  crypto:
    name: messenger-crypto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Задача называется jvmTest, а не test: с К2 модуль стал multiplatform, и
      # общей задачи 'test' в нём больше нет. Прежняя команда падала бы с
      # «task not found», а не с ошибкой в коде.
      - name: 'крипто · тесты JVM, включая сверку с BouncyCastle'
        working-directory: messenger-crypto
        run: |
          set -o pipefail
          ./gradlew jvmTest --console=plain 2>&1 | tee /tmp/gradle.log
      # Пересчёт по тем же правилам, что у сервера: «BUILD SUCCESSFUL» само по себе
      # не доказывает, что тесты шли. Нижняя граница ловит «ни один не запустился».
      - name: 'крипто · пересчёт'
        if: always()
        working-directory: messenger-crypto
        run: |
          x=build/test-results/jvmTest
          [ -d "$x" ] || { echo "::error::каталог $x отсутствует — тесты не запускались"; exit 1; }
          t=$(grep -ho 'tests="[0-9]*"' $x/*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          f=$(grep -ho 'failures="[0-9]*"' $x/*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          e=$(grep -ho 'errors="[0-9]*"' $x/*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          k=$(grep -ho 'skipped="[0-9]*"' $x/*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "JVM: тестов=$t падений=$f ошибок=$e пропущено=$k"
          echo "### крипто JVM: $t тестов, $f падений, $e ошибок, $k пропущено" >> "$GITHUB_STEP_SUMMARY"
          bad=0
          # Явный if, а не «[ ... ] || [ ... ] && bad=1»: список возвращает код
          # последней проверки, и на счастливом пути он ненулевой — под set -e шаг
          # упал бы ровно тогда, когда всё в порядке.
          if [ "$f" -ne 0 ] || [ "$e" -ne 0 ]; then
            echo "::error::падений $f, ошибок $e"
            bad=1
          fi
          if [ "$k" -ne 0 ]; then echo "::error::пропущено тестов: $k — для гейта это падение"; bad=1; fi
          if [ "$t" -lt 80 ]; then echo "::error::запущено всего $t тестов, ожидалось не меньше 80"; bad=1; fi
          exit $bad
      - name: 'крипто · вывод Gradle в аннотацию'
        if: failure()
        run: |
          msg=$(grep -aE 'error:|FAILURE:|What went wrong|Caused by|not found|Could not|^> |^e: ' /tmp/gradle.log | tail -n 30 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          if [ -z "$msg" ]; then msg=$(tail -n 25 /tmp/gradle.log | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}'); fi
          echo "::error::${msg}"
      - name: 'крипто · упавшие тесты в аннотацию'
        if: failure()
        working-directory: messenger-crypto
        run: |
          msg=$(grep -ho '<failure message="[^"]\{0,200\}"' build/test-results/jvmTest/*.xml 2>/dev/null | head -n 10 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          if [ -n "$msg" ]; then echo "::error::упавшие тесты:%0A${msg}"; fi


  # ── ГЕЙТ К2: крипто на iOS-симуляторе ─────────────────────────────────────
  # Здесь закрывается главное условие К2: тест-векторы обязаны сойтись БАЙТ В
  # БАЙТ на iOS, а не только скомпилироваться. «Компилируется» ничего не
  # доказывает — в v1 реализация ML-KEM в Kodium компилировалась, проходила
  # тесты и при этом заполняла матрицу энтропией на 3 % (ADR-0005 Поправка-1).
  #
  # Три шага в одной задаче, и порядок обязателен: форки публикуются в
  # mavenLocal, потом messenger-crypto их оттуда берёт. Разные задачи GitHub
  # Actions не делят mavenLocal — на отдельном раннере кэша не будет.
  #
  # Прогон самих форков заодно служит доказательством к PR в апстрим (вариант D):
  # автор, судя по закомментированным таргетам, прогнать их на симуляторе не
  # может, а мы можем.
  third-party-ios:
    name: 'крипто · iOS-симулятор (гейт К2)'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 'keccak · тесты на симуляторе iOS'
        working-directory: third-party/KeccakKotlin
        run: |
          set -o pipefail
          ./gradlew iosSimulatorArm64Test --console=plain 2>&1 | tee /tmp/gradle.log
      - name: 'keccak · публикация в mavenLocal'
        working-directory: third-party/KeccakKotlin
        # Кyber берёт keccak как обычную зависимость; вариантов Apple в Central нет,
        # поэтому свой keccak сначала кладём в локальный репозиторий.
        run: |
          set -o pipefail
          ./gradlew publishToMavenLocal --console=plain 2>&1 | tee -a /tmp/gradle.log
      - name: 'kyber · тесты на симуляторе iOS'
        working-directory: third-party/KyberKotlin
        run: |
          set -o pipefail
          ./gradlew iosSimulatorArm64Test --console=plain 2>&1 | tee -a /tmp/gradle.log
      # Публикация kyber была пропущена: keccak публиковался, а kyber только
       # тестировался. messenger-crypto зависит именно от kyber, поэтому без этого
      # шага он на iOS не собрался бы — и причина выглядела бы как «нет варианта
      # под iosSimulatorArm64», то есть указывала бы куда угодно, кроме сюда.
      - name: 'kyber · публикация в mavenLocal'
        working-directory: third-party/KyberKotlin
        run: |
          set -o pipefail
          ./gradlew publishToMavenLocal --console=plain 2>&1 | tee -a /tmp/gradle.log
      - name: 'крипто · ВЕКТОРЫ на симуляторе iOS'
        working-directory: messenger-crypto
        run: |
          set -o pipefail
          ./gradlew iosSimulatorArm64Test --console=plain 2>&1 | tee -a /tmp/gradle.log
      - name: 'крипто · пересчёт прогона на iOS'
        if: always()
        working-directory: messenger-crypto
        run: |
          x=build/test-results/iosSimulatorArm64Test
          [ -d "$x" ] || { echo "::error::каталог $x отсутствует — на симуляторе не запускалось ничего"; exit 1; }
          t=$(grep -ho 'tests="[0-9]*"' $x/*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          f=$(grep -ho 'failures="[0-9]*"' $x/*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          e=$(grep -ho 'errors="[0-9]*"' $x/*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          k=$(grep -ho 'skipped="[0-9]*"' $x/*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "iOS: тестов=$t падений=$f ошибок=$e пропущено=$k"
          echo "### крипто iOS-симулятор: $t тестов, $f падений, $e ошибок, $k пропущено" >> "$GITHUB_STEP_SUMMARY"
          bad=0
          # Явный if, а не «[ ... ] || [ ... ] && bad=1»: список возвращает код
          # последней проверки, и на счастливом пути он ненулевой — под set -e шаг
          # упал бы ровно тогда, когда всё в порядке.
          if [ "$f" -ne 0 ] || [ "$e" -ne 0 ]; then
            echo "::error::падений $f, ошибок $e"
            bad=1
          fi
          if [ "$k" -ne 0 ]; then echo "::error::пропущено тестов на iOS: $k — для гейта это падение"; bad=1; fi
          # На iOS идёт commonTest без jvmTest, поэтому граница ниже, чем у JVM:
          # CrossImplementationTest с BouncyCastle там не существует.
          if [ "$t" -lt 70 ]; then echo "::error::на симуляторе запущено всего $t тестов, ожидалось не меньше 70"; bad=1; fi
          exit $bad
      - name: 'форки · вывод Gradle в аннотацию'
        if: failure()
        run: |
          msg=$(grep -aE 'error:|FAILURE:|What went wrong|Caused by|not found|Could not|Unresolved|no matching|Cannot|^> |^e: ' /tmp/gradle.log | tail -n 30 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          if [ -z "$msg" ]; then msg=$(tail -n 25 /tmp/gradle.log | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}'); fi
          echo "::error::${msg}"
  # ── Сервер: сборка, разбор и ВСЕ тесты ────────────────────────────────────
  # До 2026-08-21 здесь были только build и vet, а 118 тестов шли на одной машине
  # разработки. То есть зелёный CI не означал, что сервер проверен. Хуже: прогон
  # без базы ВЫХОДИТ С НУЛЁМ — internal/api/api_test.go:52 при недоступном
  # PostgreSQL делает t.Skipf, и 70 тестов из 118 просто не выполняются.
  #
  # Отсюда две особенности этой задачи:
  #   1. службы поднимаются здесь же — Docker на раннере есть, и он нужен только
  #      раннеру, не машине разработки;
  #   2. пропуск считается ПАДЕНИЕМ. Гейт, который зеленеет на пропусках, —
  #      это не гейт.
  server:
    name: server · сборка, vet и все тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tima
          POSTGRES_PASSWORD: tima-dev-only
          # Суффикс _test обязателен: ResetForTests отказывается работать на базе
          # без него, и это защита, а не формальность — setup труncate-ит таблицы.
          POSTGRES_DB: tima_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tima -d tima_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      TIMA_TEST_DATABASE_URL: postgres://tima:tima-dev-only@localhost:5432/tima_test
      # Пароля НЕТ намеренно. redis:7 поднимается без пароля, а тест по умолчанию
      # идёт на redis://:tima-dev-only@… и получает «ERR Client sent AUTH, but no
      # password is set». Ошибку он трактует как «Redis недоступен» и пропускается:
      # живая служба читается как отсутствующая.
      TIMA_TEST_REDIS_URL: redis://localhost:6379
      TIMA_TEST_S3_ENDPOINT: http://127.0.0.1:9000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # MinIO не может быть service container: образу нужна команда `server /data`,
      # а service container команду задать не даёт — только образ, env и options.
      # Поэтому обычным docker run. Бакет media-test создаёт сам тест (blob.New).
      - name: 'сервер · поднять MinIO'
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=tima-admin \
            -e MINIO_ROOT_PASSWORD=tima-dev-only \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO готов на попытке $i"; exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO не поднялся за 60 с%0A$(docker logs minio 2>&1 | tail -n 20 | awk '{printf "%s%%0A", $0}')"
          exit 1

      - name: 'сервер · сборка'
        working-directory: server
        run: go build ./...
      - name: 'сервер · vet'
        working-directory: server
        run: go vet ./...

      - name: 'сервер · все тесты'
        working-directory: server
        run: |
          set -o pipefail
          go test -count=1 -v ./... 2>&1 | tee /tmp/go-test.log

      # Отдельный шаг, и он ГЛАВНЫЙ. `go test` печатает «ok» для пакета, в котором
      # всё пропущено, поэтому итог предыдущего шага сам по себе ничего не
      # доказывает. Ожидаемые числа — в тире server-full
      # (.cursor/skills/adaptive-test-runner/project/PROFILE.md).
      - name: 'сервер · пересчёт: пропуск = падение'
        if: always()
        run: |
          if [ ! -s /tmp/go-test.log ]; then
            echo "::error::/tmp/go-test.log пуст или отсутствует — шаг тестов не дошёл до запуска. Смотреть шаги сборки и vet выше"
            exit 1
          fi
          run=$(grep -cE '^=== RUN   Test' /tmp/go-test.log || true)
          pass=$(grep -cE '^--- PASS' /tmp/go-test.log || true)
          fail=$(grep -cE '^--- FAIL' /tmp/go-test.log || true)
          skip=$(grep -cE '^--- SKIP' /tmp/go-test.log || true)
          echo "RUN=$run PASS=$pass FAIL=$fail SKIP=$skip"
          echo "### сервер: RUN $run · PASS $pass · FAIL $fail · SKIP $skip" >> "$GITHUB_STEP_SUMMARY"
          bad=0
          if [ "$skip" -ne 0 ]; then
            why=$(grep -B2 -E '^--- SKIP' /tmp/go-test.log | grep -oE '(PostgreSQL|Redis|MinIO) недоступен' | sort -u | tr '\n' ' ')
            names=$(grep -E '^--- SKIP' /tmp/go-test.log | sed 's/^--- SKIP: //' | head -n 8 | awk '{printf "%s%%0A", $0}')
            echo "::error::пропущено тестов: $skip — для гейта это падение.%0AПричины: ${why:-неизвестны}%0A${names}"
            bad=1
          fi
          if [ "$fail" -ne 0 ]; then
            names=$(grep -E '^--- FAIL' /tmp/go-test.log | sed 's/^--- FAIL: //' | head -n 10 | awk '{printf "%s%%0A", $0}')
            echo "::error::упавшие тесты: $fail%0A${names}"
            bad=1
          fi
          # Нижняя граница ловит случай «тесты вообще не запустились»: пакет не
          # собрался, а пропусков и падений при этом ноль.
          if [ "$run" -lt 110 ]; then
            echo "::error::запущено всего $run тестов — ожидалось не меньше 110. Похоже, пакет не собрался"
            bad=1
          fi
          exit $bad

      - name: 'сервер · вывод go test в аннотацию'
        if: failure()
        run: |
          msg=$(grep -aE '^(FAIL|# |.*\.go:[0-9]+:)' /tmp/go-test.log | tail -n 30 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          if [ -z "$msg" ]; then msg=$(tail -n 25 /tmp/go-test.log | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}'); fi
          echo "::error::${msg}"
