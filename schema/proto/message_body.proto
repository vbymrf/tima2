syntax = "proto3";

// Открытый текст сообщения ДО сжатия и шифрования:
//   MessageBody --serialize--> protobuf --zstd--> Kodium.encryptSymmetric(message_key) = Envelope.encrypted_payload
// Формат текста — plain text + entities (module-boundaries.md §5). Тот же словарь
// EntityType используют посты (publications) — единый рендер.
package tima.crypto.v1;

option java_package = "io.tima.crypto.proto";
option java_multiple_files = true;

message MessageBody {
  // ── Формат 1 (исходный): плоский текст со смещениями ──
  // Смещения в кодовых единицах UTF-16 расходятся между платформами на эмодзи и
  // составных символах и требуют пересчёта при каждой правке. ADR-0011 заменяет
  // их массивом узлов; поля 1–2 остаются как переходный и запасной путь.
  string text = 1;                   // UTF-8; при наличии nodes — склейка узлов для старых клиентов
  repeated Entity entities = 2;      // offset/length — в UTF-16 code units (см. README: фикс interop)
  repeated MediaRef media = 3;       // вложения (media_key внутри — под шифрованием body)

  // ── Формат 2 (ADR-0011): узлы + разметка ──
  //
  // Текст — массив узлов, БЕЗ якорных символов и без смещений. Разметка отдельно и
  // ссылается на узлы по идентификаторам, а не по позиции: вставка узла в середину
  // иначе сдвигала бы все последующие индексы и ломала ссылки из блоков, хотя сама
  // разметка не менялась.
  //
  // markup пуст у обычного сообщения — а это 99% сообщений. Нет разметки — нет и
  // идентификаторов узлов: ссылаться на них некому.
  //
  // ВАЖНО: у приватного сообщения разметка едет ЗДЕСЬ, внутри зашифрованного тела.
  // Открытой она быть не может: она выведена из содержимого и раскрывает структуру,
  // ссылки, наличие медиа и упоминания — то есть социальный граф внутри переписки.
  repeated string nodes = 4;
  // Разметка в компактном JSON (ADR-0011 §6): один формат с читаемыми ключами,
  // сжимается zstd вместе со всем телом. Пусто = разметки нет.
  string markup = 5;

  // ── Правка (ADR-0045, Решения §8 doc_mig/РЕДАКТОР-СООБЩЕНИЙ.md) ──
  //
  // Тело записи правки — только изменённые узлы исходного; text, nodes и markup такой записи
  // пусты. Строение сообщения правка не трогает: блоки разметки исходного остаются на месте.
  //
  // Номер 7, а не 6: поле 6 обещано `StickerRef` (doc_mig/СТИКЕР-В-ТЕЛЕ-СООБЩЕНИЯ.md).
  repeated NodeEdit edits = 7;

  // Правка фото (ADR-0052): файл исходного заменяется целиком — новый номер, ключ, размеры. Тело
  // такой записи — только это поле; узлы и строение исходного не трогаются.
  repeated MediaEdit media_edits = 8;
}

// Новый файл на месте одного файла исходного сообщения.
message MediaEdit {
  // Позиция файла в media исходного.
  uint32 index = 1;
  MediaRef media = 2;
}

// Новый текст одного узла исходного сообщения.
message NodeEdit {
  // Позиция узла в nodes исходного, а не идентификатор: у сообщения без разметки
  // идентификаторов нет, а узел есть — один.
  uint32 index = 1;
  string text = 2;
  // Инлайн-оформление этого узла: JSON-массив сущностей разметки (ADR-0011 §6), поле node —
  // идентификатор узла исходного. Прежние сущности узла заменяются целиком; пусто — без
  // оформления. Смещения прежних сущностей к новому тексту не подходят, поэтому едут заново.
  string entities = 3;
}

message Entity {
  EntityType type = 1;
  uint32 offset = 2;                 // начало в UTF-16 code units
  uint32 length = 3;                 // длина в UTF-16 code units
  string url = 4;                    // ET_LINK
  string user_id = 5;                // ET_MENTION
  string attribute = 6;              // ET_HASHTAG — нормализованное имя атрибута (feed-ranking §3)
  string media_id = 7;               // ET_MEDIA (inline в статьях)
}

enum EntityType {
  ET_UNSPECIFIED = 0;
  ET_BOLD = 1;
  ET_ITALIC = 2;
  ET_UNDERLINE = 3;
  ET_STRIKETHROUGH = 4;
  ET_CODE = 5;
  ET_QUOTE = 6;
  ET_HEADING = 7;
  ET_LIST_ITEM = 8;
  ET_LINK = 9;
  ET_MENTION = 10;
  ET_HASHTAG = 11;
  ET_MEDIA = 12;
}

message MediaRef {
  string media_id = 1;
  bytes media_key = 2;               // 32 B — ключ шифрования медиа-объекта (media-storage.md §5)
  string mime = 3;
  uint64 size_bytes = 4;
  uint32 width = 5;
  uint32 height = 6;
  uint32 duration_ms = 7;
  string blurhash = 8;               // плейсхолдер до загрузки
  uint32 chunk_count = 9;            // >1 → chunked (§10.3)
  // 10 — превью фото от отправителя, снято 2026-10-22 (ADR-0052): фото забирается целиком сразу,
  // превью делает получатель. Номер не переиспользуется.
  reserved 10;
  reserved "preview";
  // Имя файла вне пузыря (Решения §6): на диске файл лежит по номеру сообщения, имя — здесь, в
  // зашифрованном теле. Пусто у фото.
  string name = 11;
  // Голосовое (ПЛАН-(ВМ) §2.2): файл на срок у сервера, Opus в Ogg; длительность — duration_ms.
  bool voice = 12;
  // Рисунок волны голосового: громкость по долям записи, байт на долю (0…255), около 64 долей.
  // Отправитель считает при записи — пузырь рисуется до скачивания.
  bytes wave = 13;
}
